
name: BLUE AI ZIP Installer

on:
  push:
    paths:
      - "incoming/*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blue-ai-installer
  cancel-in-progress: false

jobs:
  install-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: find_zip
        run: |
          ZIP=$(find incoming -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP found in incoming/"
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Validate and extract ZIP
        env:
          ZIP_FILE: ${{ steps.find_zip.outputs.zip }}
        run: |
          python3 - <<'PY'
          import os, zipfile, pathlib, shutil

          archive = os.environ["ZIP_FILE"]
          root = pathlib.Path(".").resolve()

          blocked = {".git", ".github"}
          allowed = {".py", ".js", ".jsx", ".ts", ".tsx", ".json",
                     ".css", ".html", ".md", ".txt", ".toml", ".yaml",
                     ".yml", ".sh", ".sql", ".svg", ".ico",
                     ".png", ".jpg", ".jpeg", ".webp"}

          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()

              if not entries:
                  raise SystemExit("ZIP is empty")

              for entry in entries:
                  name = entry.filename.replace("\\", "/")
                  path = pathlib.PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  if any(part in blocked for part in path.parts):
                      raise SystemExit(f"Blocked path: {name}")

                  if entry.is_dir():
                      continue

                  if path.suffix.lower() not in allowed:
                      raise SystemExit(f"Unsupported file type: {name}")

                  if name.startswith("incoming/"):
                      raise SystemExit("ZIP must not contain incoming/")

              # Strip a single common enclosing directory if present
              files = [e.filename for e in entries if not e.is_dir()]
              first_parts = [pathlib.PurePosixPath(f).parts for f in files]

              strip_prefix = ""
              if first_parts and all(len(p) > 1 for p in first_parts):
                  prefixes = {p[0] for p in first_parts}
                  if len(prefixes) == 1:
                      strip_prefix = next(iter(prefixes))

              for entry in entries:
                  if entry.is_dir():
                      continue

                  name = entry.filename.replace("\\", "/")
                  parts = pathlib.PurePosixPath(name).parts

                  if strip_prefix and parts[0] == strip_prefix:
                      parts = parts[1:]

                  if not parts:
                      continue

                  if any(p in blocked for p in parts):
                      continue

                  target = root.joinpath(*parts).resolve()

                  if root not in target.parents and target != root:
                      raise SystemExit(f"Extraction escaped repository: {name}")

                  target.parent.mkdir(parents=True, exist_ok=True)

                  with z.open(entry) as src, open(target, "wb") as dst:
                      shutil.copyfileobj(src, dst)

          print("ZIP extracted successfully.")
          PY

      - name: Remove uploaded ZIP
        run: rm -f "${{ steps.find_zip.outputs.zip }}"

      - name: Commit extracted files
        run: |
          git config user.name "BLUE AI Installer"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install BLUE AI project from uploaded ZIP"
            git push
          fi
